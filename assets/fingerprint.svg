<svg xmlns="http://www.w3.org/2000/svg" width="320" height="20" viewBox="0 0 320 20">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-style: italic;
      fill: #59636e;
    }
    @media (prefers-color-scheme: dark) {
      text { fill: #9198a1; }
    }

    .mask { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .mask { fill: #0d1117; }
    }

    .detector { opacity: 0; }
    @supports (-moz-appearance: none) { .is-firefox { opacity: 1 !important; } }
    @supports (zoom: 1) { .is-chrome { opacity: 1 !important; } }
    @supports (hanging-punctuation: first) { .is-safari { opacity: 1 !important; } }
    @media (forced-colors: active) { .is-win { opacity: 1 !important; } }
    @supports (-webkit-backdrop-filter: blur(1px)) { .is-apple { opacity: 1 !important; } }
    @media (max-width: 600px) { .is-mobile { opacity: 1 !important; } }
    @media (min-width: 601px) { .is-desktop { opacity: 1 !important; } }
  </style>

  <text x="0" y="14">reading from</text>
  <text x="68" y="14" textLength="50" lengthAdjust="spacingAndGlyphs">unknown</text>
  <text x="122" y="14">·</text>
  <text x="130" y="14" textLength="72" lengthAdjust="spacingAndGlyphs">unknown</text>
  <text x="206" y="14">·</text>
  <text x="214" y="14" textLength="55" lengthAdjust="spacingAndGlyphs">unknown</text>
  <text x="271" y="14">.</text>

  <g class="detector is-chrome">
    <rect x="67" y="2" width="52" height="16" class="mask"/>
    <text x="68" y="14" textLength="50" lengthAdjust="spacingAndGlyphs">chrome</text>
  </g>
  <g class="detector is-safari">
    <rect x="67" y="2" width="52" height="16" class="mask"/>
    <text x="68" y="14" textLength="50" lengthAdjust="spacingAndGlyphs">safari</text>
  </g>
  <g class="detector is-firefox">
    <rect x="67" y="2" width="52" height="16" class="mask"/>
    <text x="68" y="14" textLength="50" lengthAdjust="spacingAndGlyphs">firefox</text>
  </g>

  <g class="detector is-win">
    <rect x="129" y="2" width="74" height="16" class="mask"/>
    <text x="130" y="14" textLength="72" lengthAdjust="spacingAndGlyphs">windows</text>
  </g>
  <g class="detector is-apple">
    <rect x="129" y="2" width="74" height="16" class="mask"/>
    <text x="130" y="14" textLength="72" lengthAdjust="spacingAndGlyphs">macos / ios</text>
  </g>

  <g class="detector is-mobile">
    <rect x="213" y="2" width="57" height="16" class="mask"/>
    <text x="214" y="14" textLength="55" lengthAdjust="spacingAndGlyphs">mobile</text>
  </g>
  <g class="detector is-desktop">
    <rect x="213" y="2" width="57" height="16" class="mask"/>
    <text x="214" y="14" textLength="55" lengthAdjust="spacingAndGlyphs">desktop</text>
  </g>
</svg>
